[package]
name = "adaline-native"
version = "0.1.0"
edition = "2021"
description = "PyO3 bindings for frugal_ml's ADALINE/LMS adaptive noise canceller (Linear + mse + Sgd), run on the host"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# Core + heap storage only: no `std` needed for the LMS loop itself, `std` is
# only pulled in by pyo3/numpy on the Python side of this crate.
frugal_ml = { path = "../../../projects/frugal_ml", default-features = false, features = ["alloc"] }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
